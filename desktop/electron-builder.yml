appId: app.penny.desktop
productName: Penny
directories:
  output: dist-desktop
# The shell is just desktop/main.cjs; the app itself ships as resources/server.
files:
  - desktop/main.cjs
  - desktop/update.cjs
  - package.json
  # The shell uses only Electron and Node built-ins; the app's own packages ship under resources/server.
  - "!node_modules{,/**/*}"
extraResources:
  - from: .next/standalone
    to: server
    filter: ["**/*"]
# node_modules are copied in by the hook (extraResources always skips them).
afterPack: desktop/after-pack.cjs
npmRebuild: false
asar: true
icon: desktop/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Pinned: the release workflow copies this exact file to Penny-Setup-<version>.exe, which the release notes and READMEs link to.
  artifactName: Penny Setup ${version}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Penny
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Apple Developer ID yet: desktop/after-pack.cjs ad-hoc signs the app, so the first open needs Open Anyway.
  identity: null
  category: public.app-category.finance
dmg:
  artifactName: Penny-${version}-${arch}.${ext}
linux:
  target: [AppImage]
  category: Finance
