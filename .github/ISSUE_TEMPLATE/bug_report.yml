name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste bank passwords, account numbers, card numbers, or real transactions.** Replace amounts and names with made-up ones.
        Security problem? Do not open an issue; see [SECURITY.md](https://github.com/Sergey-Bar/Penny/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Penny?
      options: [Windows app, Mac app, Docker, From source]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Penny version
      description: Settings shows it, or the release you downloaded.
      placeholder: "0.2.0"
  - type: input
    id: bank
    attributes:
      label: Bank or card, if it is a sync problem
      placeholder: "e.g. Max, Hapoalim"
  - type: textarea
    id: logs
    attributes:
      label: Error message or log lines (with personal details removed)
      render: text
