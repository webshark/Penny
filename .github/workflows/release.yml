name: Release

# Push a tag like v0.2.0 (matching package.json "version") to publish a release with the Windows and Mac
# installers. Running copies see it through the update banner; Docker users update with Penny-update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm test
      - run: npm run desktop:build
      - name: Collect the installers
        shell: bash
        run: |
          mkdir out
          v="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "Windows" ]; then cp "dist-desktop/Penny Setup $v.exe" out/Penny-Setup-$v.exe; else cp dist-desktop/*.dmg out/; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true
      # The Windows app installs updates itself only when the installer matches this list.
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Penny $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
